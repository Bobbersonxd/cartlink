# Cartlink CI: one Linux build plus the Load from URL unit tests.
# Copyright (C) 2026 Cartlink contributors. GPLv3 or later (see COPYING).
name: Linux build and URL tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 \
            openssl zlib1g-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxxf86vm-dev libgl-dev libegl-dev \
            libasound2-dev libpulse-dev libudev-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev p7zip-full

      - name: Configure
        run: ./configure --disable-qt --disable-ffmpeg --disable-systemmbedtls --enable-builtinmbedtls

      - name: Build
        run: make -j"$(nproc)"

      - name: URL unit tests
        run: make -C tests-other/url_content test

      - name: URL fetch tests (local test server)
        run: make -C tests-other/url_content fetch-test

      - name: Version
        run: ./cartlink --version
