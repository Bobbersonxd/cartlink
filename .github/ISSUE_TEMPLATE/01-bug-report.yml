name: Bug report
description: Something in Cartlink does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Cartlink is an unofficial fork of RetroArch. Please report Cartlink
        problems here, not to the RetroArch/libretro team.

        **Requests for games, ROMs, BIOS files or links to them are closed
        without reply.** Don't paste links to copyrighted files.
  - type: input
    id: version
    attributes:
      label: Cartlink version
      description: "From `cartlink --version` or Information > System Information."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11, Ubuntu 24.04, Arch Linux"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce. Remove passwords, logins and private server names.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "Run with `--verbose` and paste the relevant part. Check it for private data first."
      render: text
