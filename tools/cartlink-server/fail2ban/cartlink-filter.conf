#
# fail2ban filter for the Cartlink game server: failed logins (HTTP 401) in
# Caddy's JSON access log /var/log/caddy/cartlink.log.
# Install as /etc/fail2ban/filter.d/cartlink.conf (see SETUP.md).
# Inside a JSON string every quote is written as \", so a request can't fake
# the unescaped "remote_ip":"..." or "status":401 parts.

[Definition]
failregex = ^\{.*"request":\{"remote_ip":"<HOST>".*"status":401[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
